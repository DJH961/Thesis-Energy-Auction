# ============================================================
# ETS MARL — Configuration v5.1
# P1-P8 roadmap + structural improvements:
#   - 8 learning agents + 4 heuristic bot agents
#   - price_max raised to 500 (above penalty ceiling)
#   - cap_year_0 scaled for 12 total participants
#   - MAC fuel-switching mechanism
#   - Electricity revenue (margin-based reward)
#   - Carry-forward non-compliance obligations (cap=2.0×)
#   - Re-tuned budgets, entropy, soft cycling
# ============================================================

simulation:
  n_years: 12         # 12-year horizon: solar (2yr) and onshore (5yr) payoffs fit; terminal values handle beyond-horizon
  n_episodes: 50000   # increased for 8 agents + soft cycling
  seeds: [42, 123, 456]

# ----------------------------------------------------------
# Technology parameters (5 technologies)
# Sources: IRENA 2024, IPCC AR5, IEA WEO 2024
# ----------------------------------------------------------
technologies:
  names: ["coal", "gas", "onshore_wind", "offshore_wind", "solar"]
  emission_factors: [0.820, 0.490, 0.011, 0.012, 0.048]  # tCO2/MWh
  capex: [3000, 1150, 1350, 3250, 750]                   # EUR/kW (IRENA 2024)
  capacity_factors: [0.65, 0.60, 0.35, 0.47, 0.17]
  deploy_delays: [0, 0, 3, 5, 1]                          # years; compressed so investments pay off within 12-yr episode
  operational_costs: [72.0, 55.0, 17.0, 47.0, 10.0]      # EUR/MWh fuel+O&M
  decommission_costs: [200, 100, 0, 0, 0]                 # EUR/kW
  is_green: [false, false, true, true, true]
  is_buildable: [false, false, true, true, true]

# ----------------------------------------------------------
# ETS parameters
# Cap starts above total emissions (~40.9 Mt for 12 participants),
# providing a slight surplus that transitions to scarcity
# as the LRF tightens.  Cap at year 11 ≈ 26.2 Mt (~38% reduction).
# ----------------------------------------------------------
ets:
  cap_year_0: 43.0       # Mt — slight surplus vs ~40.9 Mt initial emissions (12 participants)
  lrf_phase1: 0.043
  lrf_phase2: 0.044
  lrf_phase_switch: 4

  msr:
    enabled: true
    tnac_upper: 17.50    # scaled for 12 participants (9.60 × 43/23.5)
    tnac_lower: 6.50     # scaled for 12 participants (3.60 × 43/23.5)
    withhold_rate: 0.24
    release_amount: 0.35  # scaled for 12 participants (0.20 × 43/23.5)
    # P9: Price-responsive triggers — break procyclical hoarding loop
    price_containment_trigger: 0.70   # at 70% of price_max, suppress MSR withdrawal
    price_release_trigger: 0.85       # at 85% of price_max, force emergency release
    emergency_release_amount: 0.90    # Mt released per year in emergency (scaled for 12)

  banking: true
  reserve_price: 30.0    # static floor — matches price_min so no bids are silently rejected
  reserve_price_mode: "static"    # "static" = use reserve_price as-is; "dynamic" = max(reserve_price, discount × MA3)
  reserve_discount: 0.80          # fraction of MA3 price used as dynamic floor (only active in dynamic mode)
  reserve_initial: 50.0           # fallback reserve price before MA3 history is available (only active in dynamic mode)
  reserve_anchor: "secondary"    # "secondary" (default) or "auction" (legacy)
  unsold_to_msr: false   # unsold volume rolls over to next year's auction (not absorbed into MSR)

# ----------------------------------------------------------
# Companies (8 learning agents — 2× each of 4 archetypes)
# Reduced individual market power; each agent is 10 TWh/year.
# ----------------------------------------------------------
companies:
  n_agents: 8
  output_twh: 10.0
  initial_mix:
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # A1: coal-heavy / financial
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # A2: coal-heavy / green
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # A3: gas-dominant / financial
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # A4: gas-dominant / green
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # A5: transitioner / financial
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # A6: transitioner / green
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # A7: green-leader / financial
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # A8: green-leader / green
  reward_weights:
    - [0.75, 0.25]   # A1: coal-heavy / financial
    - [0.25, 0.75]   # A2: coal-heavy / green
    - [0.75, 0.25]   # A3: gas-dominant / financial
    - [0.25, 0.75]   # A4: gas-dominant / green
    - [0.75, 0.25]   # A5: transitioner / financial
    - [0.25, 0.75]   # A6: transitioner / green
    - [0.75, 0.25]   # A7: green-leader / financial
    - [0.25, 0.75]   # A8: green-leader / green

  # ----------------------------------------------------------
  # Heuristic bot agents (indexed after learning agents)
  # Fixed-policy bots using heuristic_policy rules.
  # Add realistic demand from high-emission archetypes.
  # Total market participants = n_agents + n_bot_agents = 12.
  # ----------------------------------------------------------
  n_bot_agents: 4
  bot_initial_mix:
    - [0.45, 0.35, 0.10, 0.05, 0.05]   # B1: coal-heavy / financial (id=8)
    - [0.45, 0.35, 0.10, 0.05, 0.05]   # B2: coal-heavy / green     (id=9)
    - [0.15, 0.50, 0.15, 0.10, 0.10]   # B3: gas-dominant / financial (id=10)
    - [0.15, 0.50, 0.15, 0.10, 0.10]   # B4: gas-dominant / green    (id=11)
  bot_reward_weights:
    - [0.50, 0.50]   # B1: balanced
    - [0.50, 0.50]   # B2: balanced
    - [0.50, 0.50]   # B3: balanced
    - [0.50, 0.50]   # B4: balanced

investment:
  max_invest_frac: 0.10
  convexity_alpha: 0.10

risk:
  p_fail_min: 0.08
  p_fail_max: 0.65
  p_fail_alpha: 0.7
  experience_discount: 0.10
  experience_threshold: 2

auction:
  price_max: 500.0     # penalty (100) + modest carry-forward premium; prevents ceiling-bid cornering
  price_min: 30.0      # matches static reserve_price — no silent bid rejection
  quantity_max: 3.0
  reserve_ratio: 0.85
  # Coverage multiplier bounds: action[1] = fraction of estimated annual need to bid.
  # [0.3, 1.3] centres the action around covering full need (1.0), max 130% coverage.
  qty_mult_low: 0.3
  qty_mult_high: 2.0
  # California-style holding limit: no single agent can receive > 25% of auctioned volume.
  max_agent_share: 1.0
  # cancel_under_subscribed: false — in the annual-auction abstraction, binary
  # cancellation is unrealistically severe (real ETS rolls cancelled volume to
  # next-day auction). Under-subscription handled by unsold→MSR tightening
  # future supply and graded shortfall penalties.
  cancel_under_subscribed: false
  # EU lot-size: bids in multiples of 500 EUAs (= 0.0005 Mt)
  lot_size: 0.0005

trading:
  enabled: true
  transaction_cost: 0.5
  spread_tolerance: 0.07      # P8: ±7% of clearing_price
  sec_mult_low: 0.8           # secondary price multiplier lower bound (×clearing_price)
  sec_mult_high: 1.3          # secondary price multiplier upper bound (×clearing_price)

secondary:
  liquidity_pool:
    # Liquidity pool disabled — financial intermediaries excluded to isolate
    # compliance-driven inter-agent trading.  Secondary market operates purely
    # agent-to-agent.  See thesis §X for justification.
    enabled: false
# ----------------------------------------------------------
# Budgets — scaled to not artificially prevent compliance.
# Each budget ≈ 1.5× expected compliance cost at moderate
# carbon prices (~150 €/t) + operational costs.
# ----------------------------------------------------------
budget:
  annual_budgets: [1500.0, 1500.0, 1200.0, 1200.0, 800.0, 800.0, 500.0, 500.0]
  bot_annual_budgets: [1500.0, 1500.0, 1200.0, 1200.0]   # B1-B4: match archetype budgets
  overspend_penalty_coef: 0.5

# ----------------------------------------------------------
# Non-compliance penalty
# carry_forward: true means shortfall is added to next year's
# compliance obligation (real EU ETS behaviour).
# With carry-forward, non_compliance_multiplier reduced to 1.0
# (the carry-forward IS the additional cost).
# ----------------------------------------------------------
penalty:
  rate: 100.0
  non_compliance_multiplier: 1.0   # was 1.5; reduced because carry-forward already adds future cost
  carry_forward: true
  carry_forward_cap: 1.0           # 1.0× base emissions — prevents compounding death spirals while preserving realistic carry-forward

price:
  initial_expected: 80.0
  price_floor: 50.0
  ar1_persistence: 0.85
  volatility_std: 0.15

# ----------------------------------------------------------
# MAC: Marginal Abatement Cost — fuel-switching mechanism
# Agents can temporarily reduce emissions by switching coal
# dispatch to gas (short-run, doesn't change capacity mix).
# Switching occurs automatically when carbon price > MAC cost.
# ----------------------------------------------------------
mac:
  enabled: true
  coal_to_gas_cost: 65.0     # €/tCO2 abated
  max_switch_frac: 0.20      # max fraction of coal output switchable per year

# ----------------------------------------------------------
# Electricity revenue — transforms reward from all-negative
# (pure cost) to a margin calculation.
# Revenue_i = output_TWh × (base_price + passthrough × carbon_price × system_avg_EF)
# Green generators benefit: same revenue, lower carbon costs.
# ----------------------------------------------------------
electricity:
  enabled: true
  base_price: 50.0           # €/MWh base electricity price
  carbon_passthrough: 0.80   # fraction of carbon cost passed into electricity price

# ----------------------------------------------------------
# Reward (HAPPO-compliant: 4 core signals)
# R_i = -cost_norm - emissions_intensity - penalty_norm + green_bonus
# ----------------------------------------------------------
reward:
  normalizer_alpha: 0.01
  clip_min: -10.0
  clip_max: 5.0
  green_floor_fossil: [0.40, 0.40, 0.30, 0.30, 0.10, 0.10, 0.00, 0.00, 0.40, 0.40, 0.30, 0.30]  # last 4 = bots
  shaping_beta: 7.0              # green_delta bonus — increased for stronger investment signal
  shaping_gamma: 1.0             # queue bonus weight — rewards active construction queue items
  shaping_decay_episode: 12000   # episodes over which shaping_weight decays to floor
  shaping_weight_floor: 0.0      # green shaping decays fully to zero
  price_anchor_delta: 0.5        # price-proximity bonus weight (Gaussian around expected_price, decays with shaping_weight)
  coverage_signal_weight: 0.3    # immediate feedback on allocation vs need (bridges bid→compliance credit assignment)
  terminal_bank_value: true      # at final year, add banked-allowance terminal value to reward
  terminal_queue_value: true     # at final year, add in-construction-queue terminal value to reward
  terminal_payoff_years: 5       # years of future carbon savings used to value construction queue items
# ----------------------------------------------------------
# Opponent modeling (Option C)
# With 12 participants: +55 dims → obs_dim_phase1 = 78, phase2 = 85
# ----------------------------------------------------------
opponent_modeling:
  enabled: true

# ----------------------------------------------------------
# Agent cycling (Option A) — SOFT mode
# All agents update, but non-active agents use reduced LR.
# Prevents equilibrium shift from hard freezing.
# ----------------------------------------------------------
agent_cycling:
  enabled: false             # HAPPO handles coordination; cycling is redundant
  soft: true
  soft_lr_scale: 0.3

# --- PPO ---
ppo:
  hidden_size: 256           # increased for larger obs space (34/38 dims)
  lr: 0.0002
  gamma: 0.99
  gae_lambda: 0.97
  clip_eps: 0.2
  entropy_coef: 0.05         # reset higher to avoid early policy freezing
  entropy_coef_final: 0.03   # keep meaningful exploration late in training
  entropy_decay_start: 3000  # slower decay onset for fresh runs after structural changes
  entropy_decay_window: 0    # 0 = auto: 80% of n_episodes
  value_coef: 0.5
  max_grad_norm: 0.3
  n_epochs: 3
  mini_batch_size: 6
  normalize_advantages: true
  log_std_min: -1.5          # e^-1.5 ≈ 0.22; was -2.0 (e^-2 ≈ 0.14) which froze exploration too early
  log_std_max: 0.0           # caps std at e^0=1.0 (was e^1=2.72)
  centralized_critic: true    # HAPPO: per-agent centralized critics seeing global state
  happo: true                 # Enable HAPPO sequential update with cumulative importance ratios
  critic_hidden_size: 256     # critic network width (can differ from actor hidden_size)
  critic_warmup_episodes: 100    # episodes to train critic only (no actor gradients) after BC
  # P11: KL-based early stopping — abort PPO epochs if approximate KL
  # between updated and data-collection policy exceeds threshold.
  # Prevents catastrophic policy drift within a single update.
  target_kl: 0.02
  kl_anchor_beta: 0.5            # initial weight of KL penalty against frozen BC policy
  kl_anchor_decay_episodes: 8000 # episodes over which beta decays linearly to 0 (extended to preserve BC "don't sell while short" behavior)

# ----------------------------------------------------------
# Curriculum learning: start with shorter episodes, ramp to full
# Prevents carry-forward death spiral during early training.
# ----------------------------------------------------------
curriculum:
  enabled: false            # disabled: 12-year episodes are short enough for direct training
  start_years: 4           # begin with 4-year episodes (agents learn basic bidding)
  ramp_episodes: 3000      # linearly ramp to full n_years over this many episodes

# ----------------------------------------------------------
# P5: Demand & Emission Uncertainty
# ----------------------------------------------------------
uncertainty:
  enabled: true
  sigma_demand: 0.07
  corr_rho: 0.40

# ----------------------------------------------------------
# P6: Construction Delay Jitter & Capacity Uncertainty
# ----------------------------------------------------------
construction_jitter:
  enabled: true
  poisson_lambdas: [1.0, 1.0, 2.0, 3.0, 1.5]
  p_cancel: 0.03
  recovery_rate: 0.40
  cf_sigma: [0.0, 0.0, 0.08, 0.08, 0.05]

# ----------------------------------------------------------
# P7: Warm-Start Pipeline
# ----------------------------------------------------------
warm_start:
  enabled: true
  n_burnin_prices: 2
  bank_seed_min: 0.5
  bank_seed_max: 2.0
  queue_mu_onshore: 1.5
  queue_mu_offshore: 0.5
  queue_mu_solar: 2.0

# ----------------------------------------------------------
# P8: Secondary Market Depth
# ----------------------------------------------------------
# (updates to existing 'trading' section above)

logging:
  log_interval: 10
  save_interval: 500
  csv_flush_interval: 1000  # flush CSV buffers every N episodes (crash resilience)
  results_dir: "results/"

# ----------------------------------------------------------
# Behavioral cloning warm-start (heuristic pre-training)
# Run before PPO to initialise the auction policy with a
# simple rule-based policy: bid at 1.1× MA3 price, bid
# estimated need, invest 2% if green_frac < 0.8, solar.
# ----------------------------------------------------------
pretrain:
  enabled: true
  episodes: 300        # episodes to collect heuristic data
  epochs: 10           # BC MSE training epochs (both auction + secondary policies)
  lr: 0.001            # separate learning rate for BC phase

# ----------------------------------------------------------
# Broken-policy detection (training safety guardrails)
# Training aborts with a RuntimeError when any check fires.
# Streak-based checks only count after critic-warmup ends.
# ----------------------------------------------------------
diagnostics:
  market_broken_window: 200           # consecutive episodes before abort
  market_broken_bid_threshold: 0.99  # avg bid >= this x price_max  -> ceiling-collapse
  floor_bid_threshold: 1.02          # avg bid <= this x price_min  -> floor-collapse
  zero_qty_threshold: 0.01           # avg bid qty <= this x qty_max -> zero-qty collapse
  # Per-agent entropy boost: when stuck at floor/ceiling for this many episodes,
  # temporarily boost entropy to force re-exploration.  In uniform-price auctions,
  # floor-bidding is suboptimal but agents can't discover this once entropy decays.
  stuck_boost_window: 250            # episodes stuck before boost triggers
  stuck_boost_coef: 0.04            # boosted entropy coef (above coef_init=0.02)

# ----------------------------------------------------------
# Historical Policy Pool (HPP) — anti-regression safety net
# Maintains a pool of past actor snapshots.  During rollout,
# some agents' actors are replaced with historical versions
# so opponents are behaviourally diverse.  This prevents
# synchronised collapse to a bad equilibrium.
# ----------------------------------------------------------
hpp:
  enabled: true
  pool_size: 10           # max snapshots per agent (FIFO)
  save_interval: 500      # episodes between snapshots (first save after BC)
  swap_prob: 0.20         # per-agent probability of using a historical policy each episode
  warmup_episodes: 1000   # don't swap until agents have basic competence

# ----------------------------------------------------------
# Epsilon-greedy exploration (physical-space)
# Anchored Gaussian exploration: samples from N(anchor, σ)
# per action dimension instead of uniform.
# See ppo_agent.py for per-dimension distributions.
# Decays linearly over training.  Prevents tanh/clamp
# saturation traps: even if the policy has collapsed to
# the floor, epsilon forces exploration of the full range.
# ----------------------------------------------------------
exploration:
  epsilon_start: 0.25      # 25% random actions early on
  epsilon_final: 0.05      # 5% residual exploration
  epsilon_decay_episodes: 7000  # linear decay over first 7000 episodes
  # Action anchors: realistic initial policy targets in physical space.
  # These set the initial policy mean (via head bias init) so agents start
  # near historically plausible actions.  Epsilon exploration also samples
  # from Gaussians around these values instead of uniform.
  # Auction: [bid_price, qty_mult, invest_frac, logit_onshore, logit_offshore, logit_solar]
  auction_anchors: [80.0, 1.0, 0.03, 0.3, -0.5, 0.5]
  # Secondary: [sec_price_multiplier, sec_qty]
  secondary_anchors: [1.05, 0.0]
