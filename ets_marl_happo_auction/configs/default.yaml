# ============================================================
# ETS MARL — Configuration v8.5.0
#   - 8 learning agents + 8 heuristic bot agents (16 total)
#   - HAPPO sequential policy update
#   - 2026-indexed non-compliance penalty with annual inflation path
#   - Episode-level inflation randomness window (small stochastic variation)
#   - MAC fuel-switching (48 EUR/tCO2), electricity revenue
#   - Carry-forward obligations (cap=2.0x)
#   - Terminal valuation: max(clearing, secondary, 80% eff_penalty)
#   - Fundamentals-based heuristic bidding (MAC→penalty gradient)
#   - Absolute-price secondary market (no multiplier)
#   - ESG reward signal (saved-carbon-years formula)
#   - Pre-auction collateral affordability clip + budget-headroom phase-1 signal
#   - Configurable heuristic tranche split/spread with urgency-adaptive T3 widening
#   - Per-tranche budget dropping (drop T1 first, then scale T2/T3)
# ============================================================

simulation:
  n_years: 12
  n_episodes: 100000
  seeds: [42, 123, 456]

tabula_rasa:
  enabled: true
  # When enabled, these OVERRIDE the corresponding values elsewhere.
  # All fractions are relative to n_episodes.
  epsilon_start: 0.50
  epsilon_final: 0.05
  epsilon_decay_frac: 0.50
  entropy_coef: 0.08
  entropy_decay_start_frac: 0.0     # no plateau — decay from ep 0
  entropy_decay_window_frac: 0.95
  critic_warmup_frac: 0.10
  shaping_decay_frac: 0.33
  hpp_warmup_frac: 0.25
  exploration_mode: "uniform"        # side-balanced uniform auction-price sampling around expected price

# ----------------------------------------------------------
# Technology parameters (5 technologies)
# Sources: IRENA 2024, IPCC AR5, IEA WEO 2024
# ----------------------------------------------------------
technologies:
  names: ["coal", "gas", "onshore_wind", "offshore_wind", "solar"]
  emission_factors: [0.820, 0.490, 0.011, 0.012, 0.048]  # tCO2/MWh
  capex: [3000, 1150, 1350, 3250, 750]                   # EUR/kW
  capacity_factors: [0.65, 0.60, 0.35, 0.47, 0.17]
  # Deploy delays: solar 2yr (EU RED III target), onshore 4yr (EU observed low-end),
  # offshore 7yr (EU observed low-end). Sources: WindEurope Grid Access Report 2024,
  # Aurora RESMOR 2026, GEM Year in Review 2024.
  deploy_delays: [0, 0, 4, 7, 2]                          # years (real EU timelines)
  operational_costs: [72.0, 55.0, 17.0, 47.0, 10.0]      # EUR/MWh fuel+O&M
  decommission_costs: [200, 100, 0, 0, 0]                 # EUR/kW
  is_green: [false, false, true, true, true]
  is_buildable: [false, false, true, true, true]

# ----------------------------------------------------------
# ETS parameters
# Core market values are calibrated at environment init based on active
# participants and their emissions profile.
# ----------------------------------------------------------
ets:
  # --- Computed at init (DO NOT set manually) ---
  # cap_year_0, msr.tnac_upper, msr.tnac_lower are now DERIVED from:
  #   total_system_emissions × (1 + cap_overhead_pct)
  # To override with a manual value, set cap_year_0_override to a number.
  cap_year_0_override: null     # null enables emission-weighted calibration
  initial_bank_fraction: 0.10   # default episode-start bank seed fraction of annual need
  cap_overhead_pct: 0.04        # 4% surplus over total initial emissions

  lrf_phase1: 0.043
  lrf_phase2: 0.044
  lrf_phase_switch: 2              # 2026–27 use 4.3%; 2028+ use 4.4% (EU ETS linear LRF)

  msr:
    enabled: true
    tnac_upper_ratio: 0.36
    tnac_mid_ratio: null            # null => derive 833/1096 proportion from upper
    tnac_lower_ratio: null          # null => derive 400/1096 proportion from upper
    withhold_rate: 0.24
    release_frac: 0.0638297872 # 3.0 Mt / 47.0 Mt
    activation_year: 1   # legacy field; 1-year TNAC lag now enforced via _prev_tnac
                         # (Decision 2015/1814 Art 1(5))
    price_containment_absolute: 350   # hard fallback for containment trigger (EUR/t)
    price_release_absolute: 450       # hard fallback for release trigger (EUR/t)
    emergency_release_frac: 0.064  # 3.0 Mt / 47.0 Mt (aligned with release_frac)
    min_auction_frac: 0.10            # safety floor for minimum auction volume

  banking: true
  reserve_price: 30.0              # auction bid floor (matches price_min)
  reserve_price_mode: "static"     # "static" or "dynamic" (= max(reserve_price, discount x MA3))
  unsold_to_msr: false             # unsold volume rolls over to next year (not absorbed into MSR)
  max_rollover_multiplier: 1.5     # caps rollover: auction_vol ≤ cap_t × multiplier per year
  # Price history anchor for MA3 calculation.
  # "auction": only successful auction clearing prices enter the MA3 (stable, prevents
  #            reserve-price pollution when auctions fail).
  # "secondary": secondary clearing prices enter the MA3 (may include reserve-price
  #              fallbacks when auctions fail, causing downward bid spirals).
  price_history_anchor: "auction"

# ----------------------------------------------------------
# Companies — 8 learning agents (2x each of 4 archetypes)
# Each agent produces 10 TWh/year.
# ----------------------------------------------------------
companies:
  n_agents: 8
  output_twh: 10.0
  initial_mix:                     # [coal, gas, onshore, offshore, solar]
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # A1: coal-heavy / financial
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # A2: coal-heavy / ESG
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # A3: gas-dominant / financial
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # A4: gas-dominant / ESG
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # A5: transitioner / financial
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # A6: transitioner / ESG
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # A7: green-leader / financial
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # A8: green-leader / ESG
  reward_weights:                  # [w_cost, w_green]
    - [1.0, 0.0]   # A1: even → pure financial
    - [0.5, 0.5]   # A2: odd  → balanced ESG
    - [1.0, 0.0]   # A3: even → pure financial
    - [0.5, 0.5]   # A4: odd  → balanced ESG
    - [1.0, 0.0]   # A5: even → pure financial
    - [0.5, 0.5]   # A6: odd  → balanced ESG
    - [1.0, 0.0]   # A7: even → pure financial
    - [0.5, 0.5]   # A8: odd  → balanced ESG

  # Heuristic bot agents (indexed after learning agents).
  # Must keep bot_initial_mix, bot_reward_weights, bot_annual_budgets
  # arrays in sync with n_bot_agents.
  # bot_reward_weights are for eval logging only — bots use heuristic_policy, not rewards.
  n_bot_agents: 8
  bot_initial_mix:
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # B1: coal-heavy (id=8)
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # B2: coal-heavy (id=9)
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # B3: gas-dominant (id=10)
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # B4: gas-dominant (id=11)
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # B5: transitioner (id=12)
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # B6: transitioner (id=13)
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # B7: green-leader (id=14)
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # B8: green-leader (id=15)
  bot_reward_weights:
    - [1.0, 0.0]   # B1
    - [0.5, 0.5]   # B2
    - [1.0, 0.0]   # B3
    - [0.5, 0.5]   # B4
    - [1.0, 0.0]   # B5
    - [0.5, 0.5]   # B6
    - [1.0, 0.0]   # B7
    - [0.5, 0.5]   # B8

investment:
  max_invest_frac: 0.20
  convexity_alpha: 0.20
  discount_rate: 0.02   # annual discount rate for heuristic NPV calculation (annuity formula)

risk:
  p_fail_min: 0.08
  p_fail_max: 0.65
  p_fail_alpha: 0.7
  experience_discount: 0.10
  experience_threshold: 2

auction:
  price_max: 500.0
  price_min: 30.0      # matches ets.reserve_price — no silent bid rejection
  quantity_max: 3.0
  # Coverage multiplier bounds: action[1] = fraction of estimated annual need to bid.
  # Centred around 1.0 (full coverage), range [0.3, 2.0] = 30%-200% of need.
  qty_mult_low: 0.3
  qty_mult_high: 1.5   # E1: per-tranche maximum multiplier. With 3 tranches this allows up
                       # to 4.5× coverage, but aggregate_bid_cap_mult: 3.0 (below) provides
                       # the binding hard cap at 3.0× annual_need across all tranches.
  # Holding limit: max fraction of auctioned volume one agent can receive.
  # 1.0 = no limit (disabled). Set to 0.25 for California-style 25% cap.
  max_agent_share: 1.0
  cancel_under_subscribed: false   # disabled — under-subscription handled by unsold rollover
  lot_size: 0.0005                 # EU lot-size: 500 EUAs = 0.0005 Mt
  # E2: Bid collateral — realistic pre-auction margin requirement.
  # Real EU ETS: bidders post initial margin with the clearing house (ECC/EEX) before
  # the auction closes. Real EUA initial margins are 5–15% of contract value depending
  # on exchange volatility regime. We use 10% as a defensible mid-range value.
  # Collateral = collateral_fraction × weighted_avg_price × total_bid_qty
  # If collateral > max_collateral_budget_share × available_budget → scale bids down.
  collateral:
    enabled: true
    collateral_rate: 0.05
    # hold_fraction=0.02 (~7 days). Real EU ETS settles T+2 (~0.0055) but one
    # annual auction step represents ~52 real auctions; 0.02 balances real
    # settlement mechanics with yearly simulation granularity.
    hold_fraction: 0.02
    # E2: collateral_fraction: flat fraction of weighted-avg (price × qty).
    # 0.10 = 10% — mid-point of real EUA exchange initial margin range (5–15%).
    # Uses weighted-average tranche price (agent's expected cost) not the max.
    collateral_fraction: 0.10
    # E2: max_collateral_budget_share: cap collateral at this fraction of remaining
    # annual budget. Prevents agents from being fully locked out of bidding after
    # prior spending. 0.50 = collateral can consume at most 50% of remaining budget.
    max_collateral_budget_share: 0.50
    min_qty_floor_frac: 0.5

  # E4: Leverage/default/suspension parameters.
  # leverage_multiplier: pre-bid notional cap = cash × leverage_multiplier.
  # collateral_fraction (above) also functions as the margin fraction locked pre-bid.
  # suspension_length: auction rounds an agent is suspended after defaulting.
  # carry_forward_defaults: whether defaulted volume is added to next auction supply.
  leverage_multiplier: 3.0       # pre-bid gate: max notional / available cash
  suspension_length: 2           # rounds suspended after default (future feature)
  carry_forward_defaults: true   # add defaulted volume to next auction q_cap

  # E1: Aggregate bid cap — total bid quantity ≤ N × annual_need
  # Prevents agents from flooding the auction with unrealistic bid quantities.
  # 3.0 = max 3× annual need across all 3 tranches combined.
  aggregate_bid_cap_mult: 3.0

# ----------------------------------------------------------
# Secondary market (agent-to-agent double auction)
# Liquidity pool disabled — pure compliance-driven trading.
# ----------------------------------------------------------
trading:
  enabled: true
  transaction_cost: 0.5
  spread_tolerance: 0.12      # +/-12% of clearing_price for bid-ask matching
  sec_price_min: 30.0         # absolute secondary price floor (= reserve price)
  sec_price_max_mult: 2.0     # secondary price cap = 2.0 × effective_penalty_rate

secondary:
  liquidity_pool:
    enabled: false             # disabled — no financial intermediaries

# ----------------------------------------------------------
# Unified financial envelope: total annual capacity for ALL spending
# (compliance + capex + MAC). Calibrated to revenue (~724 M€ for
# 10 TWh at ~72.4 EUR/MWh) × 60-70% retention + debt headroom.
# Coal-heavy tightest (highest fuel OPEX). Agents learn to allocate
# between compliance and investment.
# Sources: Scope Ratings 2023, Enel/Iberdrola 2024-2027 strategic plans.
# ----------------------------------------------------------
budget:
  mode: "revenue_based"
  # Increased by ~50 M€ for coal (agents 0-1) and gas (agents 2-3) to improve
  # compliance and budget performance under marginal-EF revenue computation.
  debt_headrooms: [400.0, 400.0, 230.0, 230.0, 50.0, 50.0, -100.0, -100.0]
  bot_debt_headrooms: [400.0, 400.0, 230.0, 230.0, 50.0, 50.0, -100.0, -100.0]
  budget_ema_alpha: 0.3
  annual_budgets: [880.0, 880.0, 800.0, 800.0, 820.0, 820.0, 780.0, 780.0]
  bot_annual_budgets: [880.0, 880.0, 800.0, 800.0, 820.0, 820.0, 780.0, 780.0]
  overspend_penalty_coef: 0.5
  contingency_zone: 0.10
  hard_cap_multiplier: 1.20
  contingency_penalty_coef: 0.05
  # H1: Budget hardening — soft zone + hard ceiling
  hard_cap_fraction: 1.15       # spending cannot exceed 115% of annual_budget
  soft_zone_start: 1.00         # tiered penalty begins at 100% spend
  tiered_penalty_coef: 2.0      # quadratic penalty coefficient in soft zone
  # H2: Investment feasibility gate
  investment_hard_gate: true    # block investment if would exceed hard cap
  # Sources: Enel/Iberdrola/RWE strategic capex plans (2024-2027) show:
  # - 5-10% contingency buffer standard in utility capex planning
  # - Board re-approval required >15%, effectively never granted >20%
  # capex_overspend_coef: 1.0 — capex throughput remains true hard cap (no soft zone)
  # Capex throughput: max annual construction spend (M€). Organizational
  # constraint — permitting pipeline, EPC capacity, mgmt bandwidth.
  # NOT a financial constraint (that's the unified budget).
  # Scaled from Iberdrola/Enel RE capex per unit output.
  capex_throughputs: [130.0, 130.0, 130.0, 130.0, 160.0, 160.0, 120.0, 120.0]
  bot_capex_throughputs: [130.0, 130.0, 130.0, 130.0, 160.0, 160.0, 120.0, 120.0]
  capex_overspend_coef: 1.0
  emergency_loan:
    enabled: true
    max_loan_fraction: 0.15
    interest_rate: 0.08
    repayment_years: 3
  suspension_length: 1

green_finance:
  enabled: false
  loan_budget_boost: 200.0       # extra M€ for green capex only
  loan_interest_rate: 0.05       # annual interest on utilized amount
  capex_throughput_boost: 80.0   # extra M€/yr capex for green only

# ----------------------------------------------------------
# Bot stochastic valuation & differentiation
# Per-bot persistent noise/multipliers sampled at episode start.
# urgency_denominators: controls the /1.5 in coverage_ratio / 1.5.
# ----------------------------------------------------------
bots:
  valuation_noise_std: 5.0         # σ for N(0, σ) valuation noise (EUR/t)
  urgency_mult_low: 0.8            # lower bound for uniform urgency multiplier
  urgency_mult_high: 1.2           # upper bound for uniform urgency multiplier
  # Heuristic tranche quantity split (T1, T2, T3). Values are normalized internally.
  # Example 50/30/20 is encoded as [0.50, 0.30, 0.20].
  tranche_qty_split: [0.50, 0.30, 0.20]
  # Heuristic tranche price multipliers around mid_price.
  # T3 spread widens with urgency in late-episode years:
  # T3 = mid_price * (tranche_price_high_mult + tranche_price_high_urgency_add * urgency)
  tranche_price_low_mult: 0.90
  tranche_price_high_mult: 1.10
  tranche_price_high_urgency_add: 0.05
  # Per-bot urgency denominators: B1=1.3, B2=1.7, B3=1.3, B4=1.7, B5=1.3, B6=1.7, B7=1.3, B8=1.7
  # This differentiates bot pairs: even bots more urgent (1.3), odd bots less urgent (1.7)
  urgency_denominators: [1.3, 1.7, 1.3, 1.7, 1.3, 1.7, 1.3, 1.7]
  # --- Enhanced noise (off by default, easily toggled) ---
  enhanced_noise:
    enabled: true
    valuation_noise_std: 15.0
    urgency_mult_low: 0.6
    urgency_mult_high: 1.5
    budget_stress_prob: 0.15
    budget_stress_qty_mult: 0.65
  # --- Bot fade schedule (off by default, easily toggled) ---
  fade_schedule:
    enabled: false
    # [episode_threshold, n_active_bots] — bots retire in reverse order
    schedule: [[0, 8], [30000, 6], [60000, 4], [80000, 2]]

# ----------------------------------------------------------
# Non-compliance penalty & general inflation
# inflation_rate applies economy-wide: penalty, CapEx, OpEx,
# decommission costs, MAC switching cost, electricity base price.
# ----------------------------------------------------------
penalty:
  rate: 138.75                     # EUR/tCO2 base in 2026 (132.06 in 2024 indexed by 2.5% for 2 years)
  inflation_rate: 0.020            # μ = 2.0% annual inflation (historical average)
  inflation_random_std: 0.015      # σ = 1.5%-pt annual inflation volatility (normal sampling)
  carry_forward: true
  carry_forward_cap: 1.0           # max carry-forward as multiple of base annual emissions

# ----------------------------------------------------------
# AR(1) expected price model
# Generates expected_price for observation space.
# NOT the auction floor — that is ets.reserve_price.
# ----------------------------------------------------------
price:
  initial_expected: 80.0   # calibrated near recent EU ETS auction levels
  ar1_floor: 65.0          # mean-reversion floor for AR(1) price simulation
  burnin_std: 10.0         # warm-start synthetic price history volatility
  ar1_persistence: 0.85
  volatility_std: 0.15

# ----------------------------------------------------------
# MAC: Marginal Abatement Cost — fuel-switching mechanism
# Automatic coal->gas dispatch when carbon price > MAC cost.
# ----------------------------------------------------------
mac:
  enabled: true
  coal_to_gas_cost: 48.0     # EUR/tCO2 — mid-range ICIS 2020-2025 front-month switching cost for avg-efficiency plants
  max_switch_frac: 0.20      # max fraction of coal output switchable per year

# ----------------------------------------------------------
# Electricity revenue — margin-based reward component.
# Revenue_i = output_TWh x (base_price + passthrough x carbon_price x sys_avg_EF)
# ----------------------------------------------------------
electricity:
  enabled: true
  base_price: 50.0           # EUR/MWh base electricity price
  carbon_passthrough: 0.80   # fraction of carbon cost passed into electricity price

# ----------------------------------------------------------
# Reward (HAPPO-compliant)
# R_i = -cost_norm - emissions_intensity - penalty_norm
#        + green_bonus + queue_bonus + terminal_values
# ----------------------------------------------------------
reward:
  normalizer_alpha: 0.01
  opportunity_cost_rate: 0.0  # H4: disabled — agents learn holding decisions through terminal value
  clip_min: -10.0
  clip_max: 10.0         # Increased from 5.0 — symmetric with clip_min to avoid asymmetric gradient compression
  shaping_beta: 7.0              # green_delta bonus weight
  shaping_gamma: 1.0             # queue bonus weight
  shaping_decay_episode: 0       # auto: 12% of n_episodes, clamped to [300, 8000]
  shaping_weight_floor: 0.0      # shaping decays fully to zero
  terminal_bank_value: true      # value banked allowances at terminal_price in final year
  terminal_queue_value: true     # value construction queue via NPV of carbon savings
  terminal_payoff_years: 5       # years of future savings for queue valuation

# ----------------------------------------------------------
# ESG signal — saved-carbon-years formula
# esg = w_green × esg_scale × ef_ratio × time_ratio
# where ef_ratio = (initial_ef - current_ef) / initial_ef
#       time_ratio = remaining_years / n_years
# Terminal ESG: queue items valued by γ^years_late discount
#   with effective_remaining = max(0, terminal_payoff_years - years_late)
#   normalized by initial_ef × output_twh × n_years
# ----------------------------------------------------------
esg:
  enabled: true
  scale: 3.5
  # Reward = w_cost × (-cost_norm) + w_green × (esg_scale × esg_raw) + shaping
  # Financial agents (w_green=0): reward = -cost_norm
  # ESG agents (w_green=0.5): reward = 0.5×(-cost_norm) + 0.5×(esg_scaled)
  # This structurally guarantees 50/50 financial/environmental weighting.

# ----------------------------------------------------------
# Opponent modeling — 6D public info per opponent.
# obs_dim_phase1 = 29 + 6*(N_total-1) = 119 (for 16 agents)
# obs_dim_phase2 = phase1 + 16 = 135
# ----------------------------------------------------------
opponent_modeling:
  enabled: true

# ----------------------------------------------------------
# Agent cycling (disabled — HAPPO handles coordination)
# ----------------------------------------------------------
agent_cycling:
  enabled: false
  soft: true
  soft_lr_scale: 0.3

# ----------------------------------------------------------
# PPO / HAPPO
# ----------------------------------------------------------
ppo:
  hidden_size: 256           # actor network width (obs: 103D phase1 / 110D phase2)
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.97
  clip_eps: 0.2
  entropy_coef: 0.05
  entropy_coef_final: 0.025
  entropy_decay_start: 0     # auto: 5% of n_episodes
  entropy_decay_window: 0    # 0 = auto (80% of n_episodes)
  value_coef: 0.5
  max_grad_norm: 0.5         # relaxed from 0.3 — less conservative with larger batches
  n_epochs: 5                # increased from 3 — extract more signal from larger batch
  mini_batch_size: 32        # increased from 6 — reasonable with 96 transitions per batch
  episodes_per_update: 16    # long-run default (>20k episodes)
  long_run_episode_threshold: 20000
  short_run_overrides:
    lr: 0.0002
    entropy_coef_final: 0.03
    episodes_per_update: 8
  normalize_advantages: true
  log_std_min: -2.5          # e^-2.5 ~ 0.08 — allows tighter final convergence
  log_std_max: 0.0           # e^0 = 1.0
  centralized_critic: true
  happo: true
  critic_lr: 0.001           # separate faster critic learning rate
  critic_hidden_size: 512    # increased from 256 — more capacity for 680D input
  critic_warmup_episodes: 0    # auto: 6% of n_episodes, clamped to [60, 1200]
  lr_decay: cosine           # cosine annealing schedule for both optimizers
  lr_min: 0.00001            # minimum learning rate at end of cosine decay
  target_kl: 0.02            # KL-based early stopping per PPO epoch
  kl_anchor_beta: 0.5        # KL penalty weight against frozen BC policy
  kl_anchor_decay_episodes: 0   # auto: 50% of n_episodes, clamped to [500, 40000]
  critic_extra_epochs: 5     # extra critic-only training epochs before main PPO loop
  critic_huber: true         # use Huber loss for critic instead of MSE
  critic_huber_delta: 10.0   # delta parameter for Huber loss
  clip_value: true           # value function clipping (enabled by default)
  normalize_returns: false   # disabled: per-agent RewardNormalizer already stabilizes scale

# ----------------------------------------------------------
# Curriculum learning (disabled — 12-year episodes train directly)
# ----------------------------------------------------------
curriculum:
  enabled: false
  start_years: 4
  ramp_episodes: 3000

# ----------------------------------------------------------
# P5: Demand & Emission Uncertainty
# ----------------------------------------------------------
uncertainty:
  enabled: true
  sigma_demand: 0.07
  corr_rho: 0.40

# ----------------------------------------------------------
# P6: Construction Delay Jitter & Capacity Uncertainty
# ----------------------------------------------------------
construction_jitter:
  enabled: true
  poisson_lambdas: [1.0, 1.0, 2.0, 3.0, 1.5]
  p_cancel: 0.03
  recovery_rate: 0.40
  cf_sigma: [0.0, 0.0, 0.08, 0.08, 0.05]

# ----------------------------------------------------------
# P7: Warm-Start Pipeline
# ----------------------------------------------------------
warm_start:
  enabled: true
  burnin_enabled: true
  n_burnin_years: 4
  burnin_price_seed_mean: 70.0
  burnin_price_seed_std: 10.0
  n_burnin_prices: 2
  bank_seed_min: 0.05
  bank_seed_max: 0.15
  queue_mu_onshore: 1.5
  queue_mu_offshore: 0.5
  queue_mu_solar: 2.0

# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------
logging:
  log_interval: 10
  save_interval: 500
  csv_flush_interval: 1000
  results_dir: "results/"

# ----------------------------------------------------------
# Behavioral cloning warm-start (heuristic pre-training)
# ----------------------------------------------------------
pretrain:
  enabled: true
  episodes: 0   # auto: 4% of n_episodes, clamped to [40, 2000] (increased from 800 for better BC warm-start)
  epochs: 0     # auto: scales with n_episodes, clamped to [4, 12]
  lr: 0.001

# ----------------------------------------------------------
# Broken-policy detection (training safety guardrails)
# Streak-based checks trigger warnings (not aborts) after
# critic-warmup ends. NaN rewards abort immediately.
# ----------------------------------------------------------
diagnostics:
  market_broken_window: 200           # consecutive episodes before warning
  market_broken_bid_threshold: 0.99   # avg bid >= this x price_max -> ceiling warning
  floor_bid_threshold: 1.02           # avg bid <= this x price_min -> floor warning
  zero_qty_threshold: 0.01            # avg bid qty <= this x qty_max -> zero-qty warning
  stuck_boost_window: 250             # episodes stuck before entropy boost triggers
  stuck_boost_coef: 0.04              # boosted entropy coef

# ----------------------------------------------------------
# Historical Policy Pool (HPP)
# Anti-regression: random rollback to past actor snapshots
# keeps opponent diversity and prevents synchronized collapse.
# ----------------------------------------------------------
hpp:
  enabled: true
  pool_size: 10
  save_interval: 0      # auto: 3% of n_episodes, clamped to [50, 1000]
  swap_prob: 0.20
  warmup_episodes: 0    # auto: 20% of n_episodes, clamped to [200, 6000]

# ----------------------------------------------------------
# Epsilon-greedy exploration (physical-space)
# Anchored Gaussian: samples from N(anchor, sigma) per dim.
# Decays linearly over training.
# ----------------------------------------------------------
exploration:
  mode: "anchored"            # "anchored" (default) or "uniform"
  epsilon_start: 0.25
  epsilon_final: 0.05
  epsilon_decay_episodes: 0   # auto: 35% of n_episodes, clamped to [300, 12000]
  # Action anchors in physical space (set initial policy mean via head bias).
  # Auction: [p1, q1, p2, q2, p3, q3, invest_frac, logit_onshore, logit_offshore, logit_solar]
  # 3-tranche ladder: tranche 1 slightly below, tranche 2 at, tranche 3 slightly above expected price
  # qty_mult per tranche biased to 0.40 each → total 1.2 (qty_mult ≈ 1.2 for compliance)
  auction_anchors: [75.0, 0.40, 80.0, 0.40, 85.0, 0.40, 0.03, 0.3, -0.5, 0.5]
  # Secondary: [sec_price (absolute €/t), sec_qty]
  secondary_anchors: [80.0, 0.0]

# ----------------------------------------------------------
# Held for next iteration — implemented but NOT enabled.
# Flip enabled: true when ready for curriculum experiments.
# ----------------------------------------------------------

# Immediate-post-auction coverage shaping: bonus reward proportional to
# coverage_ratio, decaying over training. Encourages compliance early on.
coverage_shaping:
  enabled: false
  weight: 0.5                    # reward bonus weight
  decay_start_frac: 0.0          # start decaying from episode 0
  decay_end_frac: 0.30           # fully off by 30% of training

# Cap curriculum: start with cap multiplied by cap_start, decay to 1.0
# over the first 30% of training. Eases cold-start market dynamics.
cap_curriculum:
  enabled: false
  cap_start: 1.3                 # initial cap multiplier (relaxed)
  cap_end: 1.0                   # final cap multiplier (nominal)
  decay_frac: 0.30               # fraction of n_episodes to decay over

# Budget curriculum: start with budget multiplied by budget_start, decay to 1.0
# over the first 30% of training. Prevents early-training budget starvation.
budget_curriculum:
  enabled: false
  budget_start: 1.5              # initial budget multiplier (generous)
  budget_end: 1.0                # final budget multiplier (nominal)
  decay_frac: 0.30               # fraction of n_episodes to decay over
