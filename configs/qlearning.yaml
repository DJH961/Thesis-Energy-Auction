# ============================================================
# ETS MARL — Q-Learning Baseline Configuration
# Inherits environment settings from default.yaml (loaded first),
# then overrides RL-specific parameters for tabular Q-learning.
# ============================================================

# --- Q-Learning hyperparameters ---
qlearning:
  n_episodes: 5000
  alpha: 0.1             # learning rate
  gamma: 0.95            # discount factor
  epsilon_start: 1.0     # initial exploration rate
  epsilon_end: 0.05      # final exploration rate
  epsilon_decay_frac: 0.7  # fraction of episodes over which epsilon decays

# --- Evaluation ---
evaluation:
  n_episodes: 100         # greedy eval episodes after training
  epsilon: 0.0            # fully greedy

# --- Logging ---
logging:
  log_interval: 50
  save_interval: 500
  csv_flush_interval: 500
  results_dir: "results/qlearning/"
