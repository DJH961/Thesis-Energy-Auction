# ============================================================
# ETS MARL — Configuration v8.0.1
#   - 8 learning agents, 0 bots (pure MARL)
#   - HAPPO sequential policy update, centralized critic
#   - Fundamental price anchor (MAC-scarcity-penalty formula)
#   - Coverage gap shaping unified (single mechanism)
#   - MAC fuel-switching, electricity revenue, carry-forward
#   - Warm-start, HPP, epsilon-greedy uniform exploration
#   - 2026-indexed penalty with annual inflation, phantom bidder off
# ============================================================

simulation:
  n_years: 12
  n_episodes: 100000
  seeds: [42, 123, 456]


# ----------------------------------------------------------
# Technology parameters (5 technologies)
# Sources: IRENA 2024, IPCC AR5, IEA WEO 2024
# ----------------------------------------------------------
technologies:
  names: ["coal", "gas", "onshore_wind", "offshore_wind", "solar"]
  emission_factors: [0.820, 0.490, 0.011, 0.012, 0.048]  # tCO2/MWh
  capex: [3000, 1150, 1350, 3250, 750]                   # EUR/kW
  capacity_factors: [0.65, 0.60, 0.35, 0.47, 0.17]
  # Deploy delays: solar 2yr (EU RED III), onshore 4yr, offshore 7yr.
  # Sources: WindEurope Grid Access Report 2024, Aurora RESMOR 2026.
  deploy_delays: [0, 0, 4, 7, 2]
  operational_costs: [72.0, 55.0, 17.0, 47.0, 10.0]      # EUR/MWh fuel+O&M
  decommission_costs: [200, 100, 0, 0, 0]                 # EUR/kW
  is_green: [false, false, true, true, true]
  is_buildable: [false, false, true, true, true]

# ----------------------------------------------------------
# ETS parameters
# cap_year_0 and MSR thresholds are derived from participant
# emissions at init. Use cap_year_0_override to fix manually.
# ----------------------------------------------------------
ets:
  cap_year_0_override: null     # null = emission-weighted calibration
  # Calibration anchor: band_width / (LRF × cap_0) ≈ 10 years, matching EU ETS design intent.
  # initial_bank_fraction set jointly so TNAC/tnac_upper = 1.05 at episode start
  # (2026 observed: 1,148 Mt / 1,096 Mt = 1.05).
  initial_bank_fraction: 0.81
  # +12% cap overhead: reflects real 2026 EU ETS ~15% overhead; slightly conservative
  # for micro-ETS scale.
  cap_overhead_pct: 0.12

  lrf_phase1: 0.043
  lrf_phase2: 0.044
  lrf_phase_switch: 2              # 2026–27 use 4.3%; 2028+ use 4.4% (EU ETS LRF)

  msr:
    enabled: true
    # tnac_upper_ratio: derived from 10 × LRF annual reduction / 0.635,
    # matching real EU ETS band-to-annual-reduction ratio of ~14 years.
    tnac_upper_ratio: 0.68
    tnac_mid_ratio: null            # null => derive from upper (preserves 400:833:1096 proportions)
    tnac_lower_ratio: null          # null => derive from upper
    withhold_rate: 0.24
    release_frac: 0.0638297872      # 3.0 Mt / 47.0 Mt
    activation_year: 1              # 1-year TNAC lag (Decision 2015/1814 Art 1(5))
    price_containment_absolute: 175
    price_release_absolute: 212
    price_release_enabled: false    # disable procyclical emergency reserve injection
    emergency_release_frac: 0.064
    min_auction_frac: 0.10

  banking: true
  reserve_price: 45.0              # auction bid floor (below MAC=48, prevents degenerate equilibrium)
  reserve_price_mode: "static"
  unsold_to_msr: false
  max_rollover_multiplier: 1.5
  price_history_anchor: "auction"  # only successful auction clears enter MA3

# ----------------------------------------------------------
# Companies — 8 learning agents (2x each of 4 archetypes)
# Each agent produces 10 TWh/year.
# ----------------------------------------------------------
companies:
  n_agents: 8
  output_twh: 10.0
  initial_mix:                     # [coal, gas, onshore, offshore, solar]
    - [0.25, 0.30, 0.20, 0.15, 0.10]   # A1: 45% green, ef≈0.355
    - [0.25, 0.30, 0.20, 0.15, 0.10]   # A2: 45% green, ef≈0.355
    - [0.15, 0.35, 0.25, 0.15, 0.10]   # A3: 50% green, ef≈0.299
    - [0.15, 0.35, 0.25, 0.15, 0.10]   # A4: 50% green, ef≈0.299
    - [0.10, 0.25, 0.30, 0.20, 0.15]   # A5: 65% green, ef≈0.210
    - [0.10, 0.25, 0.30, 0.20, 0.15]   # A6: 65% green, ef≈0.210
    - [0.05, 0.20, 0.30, 0.25, 0.20]   # A7: 75% green, ef≈0.143
    - [0.05, 0.20, 0.30, 0.25, 0.20]   # A8: 75% green, ef≈0.143
  reward_weights:                  # [w_cost, w_green]
    - [1.0, 0.0]   # A1: pure financial
    - [0.5, 0.5]   # A2: balanced ESG
    - [1.0, 0.0]   # A3: pure financial
    - [0.5, 0.5]   # A4: balanced ESG
    - [1.0, 0.0]   # A5: pure financial
    - [0.5, 0.5]   # A6: balanced ESG
    - [1.0, 0.0]   # A7: pure financial
    - [0.5, 0.5]   # A8: balanced ESG

  # Heuristic bot agents (indexed after learning agents).
  # bot arrays must stay in sync with n_bot_agents.
  n_bot_agents: 0
  bot_initial_mix:
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # B1: coal-heavy (id=8)
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # B2: coal-heavy (id=9)
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # B3: gas-dominant (id=10)
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # B4: gas-dominant (id=11)
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # B5: transitioner (id=12)
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # B6: transitioner (id=13)
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # B7: green-leader (id=14)
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # B8: green-leader (id=15)
  bot_reward_weights:
    - [1.0, 0.0]   # B1
    - [0.5, 0.5]   # B2
    - [1.0, 0.0]   # B3
    - [0.5, 0.5]   # B4
    - [1.0, 0.0]   # B5
    - [0.5, 0.5]   # B6
    - [1.0, 0.0]   # B7
    - [0.5, 0.5]   # B8

investment:
  max_invest_frac: 0.20
  convexity_alpha: 0.20
  discount_rate: 0.02

risk:
  p_fail_min: 0.08
  p_fail_max: 0.65
  p_fail_alpha: 0.7
  experience_discount: 0.10
  experience_threshold: 2

auction:
  price_max: 250.0     # above penalty ceiling (~170 EUR/t at yr11 @ 2% inflation)
  price_min: 45.0      # matches ets.reserve_price
  quantity_max: 3.0
  qty_mult_low: 0.5
  qty_mult_high: 2.0
  max_agent_share: 1.0
  pricing_rule: "uniform"           # EU ETS uniform-price sealed-bid (Regulation 1031/2010)
  cancel_under_subscribed: false
  lot_size: 0.0005                  # 500 EUAs = 0.0005 Mt
  # Bid collateral: 15% rate, 20% of notional. Models EU ECC/EEX margin requirements.
  collateral:
    enabled: true
    collateral_rate: 0.15
    hold_fraction: 0.02
    collateral_fraction: 0.20
    max_collateral_budget_share: 0.50
    min_qty_floor_frac: 0.5
  leverage_multiplier: 3.0
  suspension_length: 2
  carry_forward_defaults: true

# ----------------------------------------------------------
# Secondary market (agent-to-agent double auction)
# ----------------------------------------------------------
trading:
  enabled: true
  transaction_cost: 0.5
  spread_tolerance: 0.12
  sec_price_min: 45.0
  sec_price_max_mult: 2.0

secondary:
  liquidity_pool:
    enabled: false
    floor_fraction_of_penalty: 0.25

# ----------------------------------------------------------
# Budget envelope
# Calibrated to revenue (~724 M€ for 10 TWh) × 60–70% retention.
# ----------------------------------------------------------
budget:
  mode: "revenue_based"
  debt_headrooms: [400.0, 400.0, 230.0, 230.0, 50.0, 50.0, -100.0, -100.0]
  bot_debt_headrooms: [400.0, 400.0, 230.0, 230.0, 50.0, 50.0, -100.0, -100.0]
  budget_ema_alpha: 0.3
  annual_budgets: [880.0, 880.0, 800.0, 800.0, 820.0, 820.0, 780.0, 780.0]
  bot_annual_budgets: [880.0, 880.0, 800.0, 800.0, 820.0, 820.0, 780.0, 780.0]
  dynamic_budget_ceiling_multiplier: 1.5   # caps revenue-based budget to 1.5× annual_budget
  overspend_penalty_coef: 0.5
  contingency_zone: 0.10
  hard_cap_multiplier: 1.20
  contingency_penalty_coef: 0.05
  hard_cap_fraction: 1.15
  soft_zone_start: 1.00
  tiered_penalty_coef: 2.0
  investment_hard_gate: true
  capex_throughputs: [130.0, 130.0, 130.0, 130.0, 160.0, 160.0, 120.0, 120.0]
  bot_capex_throughputs: [130.0, 130.0, 130.0, 130.0, 160.0, 160.0, 120.0, 120.0]
  capex_overspend_coef: 1.0
  emergency_loan:
    enabled: true
    max_loan_fraction: 0.15
    interest_rate: 0.08
    repayment_years: 3
  suspension_length: 1

green_finance:
  enabled: false
  loan_budget_boost: 200.0
  loan_interest_rate: 0.05
  capex_throughput_boost: 80.0

# ----------------------------------------------------------
# Bot stochastic valuation & differentiation
# ----------------------------------------------------------
bots:
  valuation_noise_std: 5.0
  urgency_mult_low: 0.8
  urgency_mult_high: 1.2
  urgency_denominators: [1.3, 1.7, 1.3, 1.7, 1.3, 1.7, 1.3, 1.7]
  max_compliance_share: 0.70
  enhanced_noise:
    enabled: true
    valuation_noise_std: 15.0
    urgency_mult_low: 0.6
    urgency_mult_high: 1.5
    budget_stress_prob: 0.15
    budget_stress_qty_mult: 0.65
  fade_schedule:
    enabled: false
    schedule: [[0, 8], [30000, 6], [60000, 4], [80000, 2]]

# ----------------------------------------------------------
# Non-compliance penalty & general inflation
# inflation_rate applies to: penalty, CapEx, OpEx, MAC, electricity base.
# ----------------------------------------------------------
penalty:
  rate: 138.75                     # EUR/tCO2 base in 2026 (132.06 in 2024 + 2.5%/yr × 2)
  inflation_rate: 0.020
  inflation_random_std: 0.015
  carry_forward: true
  carry_forward_cap: 0.0           # 0.0 = no cap

# ----------------------------------------------------------
# AR(1) expected price model
# Mean-reversion target is dynamically computed via
# compute_fundamental_anchor(year, config) — MAC-scarcity-penalty formula.
# banking_premium_mult: multiplier on MAC to account for banking option value.
# ----------------------------------------------------------
price:
  banking_premium_mult: 1.4        # MAC × 1.4 = ~67 EUR/t at year 0
  burnin_std: 10.0
  ar1_persistence: 0.85
  volatility_std: 0.15

# ----------------------------------------------------------
# MAC: Marginal Abatement Cost — fuel-switching
# Automatic coal→gas dispatch when carbon_price > coal_to_gas_cost.
# Also used as the base of the fundamental price anchor formula.
# ----------------------------------------------------------
mac:
  enabled: true
  coal_to_gas_cost: 48.0           # EUR/tCO2 (ICIS 2020-2025 front-month switching cost)
  max_switch_frac: 0.20

# ----------------------------------------------------------
# Electricity revenue
# Revenue_i = output_TWh × (base_price + passthrough × carbon_price × marginal_ef)
# ----------------------------------------------------------
electricity:
  enabled: true
  base_price: 55.0
  carbon_passthrough: 0.90

# ----------------------------------------------------------
# Reward
# R_i = -cost_norm + green_bonus + coverage_gap_shaping + terminal_values
# ----------------------------------------------------------
reward:
  normalizer_alpha: 0.01
  gae_min_std: 0.1
  opportunity_cost_rate: 0.0
  clip_min: -10.0
  clip_max: 10.0
  shaping_beta: 7.0                # green_delta bonus weight
  shaping_gamma: 1.0               # queue bonus weight
  shaping_decay_episode: 0         # auto: 40% of n_episodes, clamped to [500, 80000]
  shaping_weight_floor: 0.0
  terminal_bank_value: true
  terminal_queue_value: true
  terminal_payoff_years: 5

  # Opportunity cost shaping: per-Mt premium paid on secondary vs auction.
  # Decays with shaping_weight so equilibrium reward is pure.
  opportunity_cost_shaping:
    enabled: true
    scale: 1.0

  # Coverage gap shaping: immediate signal when bought < compliance need.
  # Decays with shaping_weight so equilibrium reward is pure.
  # This is the single coverage shaping mechanism in this codebase.
  coverage_gap_shaping:
    enabled: true
    scale: 0.5

# ----------------------------------------------------------
# ESG signal — saved-carbon-years formula
# esg = w_green × esg_scale × ef_ratio × time_ratio × compliance_gate
# compliance_gate = coverage_frac² (suppresses ESG for non-compliant agents)
# ----------------------------------------------------------
esg:
  enabled: true
  scale: 2.0

# ----------------------------------------------------------
# Opponent modeling — public info per opponent
# ----------------------------------------------------------
opponent_modeling:
  enabled: true

# ----------------------------------------------------------
# Agent cycling (disabled — HAPPO handles coordination)
# ----------------------------------------------------------
agent_cycling:
  enabled: false
  soft: true
  soft_lr_scale: 0.3

# ----------------------------------------------------------
# PPO / HAPPO
# ----------------------------------------------------------
ppo:
  hidden_size: 256
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.97
  clip_eps: 0.2
  entropy_coef: 0.08
  entropy_coef_final: 0.025
  entropy_decay_start: -1          # -1 = auto (5% of n_episodes); 0 = start immediately
  entropy_decay_window: -1         # -1 = auto (90% of n_episodes)
  value_coef: 0.5
  max_grad_norm: 0.5
  n_epochs: 5
  mini_batch_size: 32
  episodes_per_update: 16
  long_run_episode_threshold: 20000
  short_run_overrides:
    lr: 0.0002
    entropy_coef_final: 0.03
    episodes_per_update: 8
  normalize_advantages: true
  log_std_min: -2.5
  log_std_max: 0.0
  centralized_critic: true
  happo: true
  critic_lr: 0.001
  critic_hidden_size: 512
  critic_warmup_episodes: 0        # auto: 3% of n_episodes, clamped to [100, 5000]
  lr_decay: cosine
  lr_min: 0.00001
  target_kl: 0.02
  kl_anchor_beta: 0.0              # 0 = KL anchor disabled (pretrain is off by default)
  kl_anchor_decay_episodes: 0      # auto: 50% of n_episodes, clamped to [500, 40000]
  critic_extra_epochs: 5
  critic_huber: true
  critic_huber_delta: 10.0
  clip_value: true
  normalize_returns: false

# ----------------------------------------------------------
# Curriculum learning
# ----------------------------------------------------------
curriculum:
  enabled: false
  start_years: 4
  ramp_episodes: 3000

# ----------------------------------------------------------
# Demand & emission uncertainty
# ----------------------------------------------------------
uncertainty:
  enabled: true
  sigma_demand: 0.07
  corr_rho: 0.40

# ----------------------------------------------------------
# Construction delay jitter & capacity uncertainty 
# ----------------------------------------------------------
construction_jitter:
  enabled: true
  poisson_lambdas: [1.0, 1.0, 2.0, 3.0, 1.5]
  p_cancel: 0.03
  recovery_rate: 0.40
  cf_sigma: [0.0, 0.0, 0.08, 0.08, 0.05]

# ----------------------------------------------------------
# Warm-start pipeline
# ----------------------------------------------------------
warm_start:
  enabled: true
  burnin_enabled: true
  n_burnin_years: 4
  burnin_price_seed_mean: 70.0
  burnin_price_seed_std: 10.0
  n_burnin_prices: 2
  bank_seed_min: 0.15
  bank_seed_max: 0.35
  queue_mu_onshore: 1.5
  queue_mu_offshore: 0.5
  queue_mu_solar: 2.0

# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------
logging:
  log_interval: 10
  save_interval: 500
  csv_flush_interval: 1000
  snapshot_interval: 2500
  results_dir: "results/"
  checkpoint_pruning:
    enabled: true
    n_keep_milestones: 20
    n_keep_recent: 5

# ----------------------------------------------------------
# Behavioral cloning warm-start (disabled by default)
# Enable for ablation studies comparing fundamental-anchor
# initialization vs BC-pretrained initialization.
# ----------------------------------------------------------
pretrain:
  enabled: false
  episodes: 0   # auto: 4% of n_episodes, clamped to [40, 2000]
  epochs: 0     # auto: scales with n_episodes, clamped to [4, 12]
  lr: 0.001

# ----------------------------------------------------------
# Training diagnostics / safety guardrails
# ----------------------------------------------------------
diagnostics:
  market_broken_window: 200
  market_broken_bid_threshold: 0.99
  floor_bid_threshold: 1.02
  zero_qty_threshold: 0.01
  stuck_boost_window: 250
  stuck_boost_coef: 0.04
  esg_over_penalty_warn_window: 50

# ----------------------------------------------------------
# Historical Policy Pool (HPP)
# Anti-regression: random rollback to past actor snapshots.
# seed_heuristic requires pretrain.enabled=true (BC must have run).
# ----------------------------------------------------------
hpp:
  enabled: true
  pool_size: 10
  save_interval: 0      # auto: 3% of n_episodes, clamped to [50, 1000]
  swap_prob: 0.20
  warmup_episodes: 0    # auto: 20% of n_episodes, clamped to [200, 30000]
  seed_heuristic: false # requires pretrain.enabled=true
  seed_count: 2

# ----------------------------------------------------------
# Epsilon-greedy exploration (physical-space, uniform mode)
# Uniform: samples bid_price from uniform([price_min, price_max])
# instead of from the policy distribution. Prevents floor-price
# lock-in by ensuring early exploration covers the full range.
# ----------------------------------------------------------
exploration:
  mode: "uniform"
  epsilon_start: 0.25
  epsilon_final: 0.05
  epsilon_decay_episodes: 0        # auto: 75% of n_episodes, clamped to [1000, 100000]
  auction_anchors: null            # null = fundamental-anchor initialization (via inject_fundamental_anchor)
  secondary_anchors: null

# ----------------------------------------------------------
# Cap/budget curricula
# ----------------------------------------------------------
cap_curriculum:
  enabled: false
  cap_start: 1.3
  cap_end: 1.0
  decay_frac: 0.30

budget_curriculum:
  enabled: false
  budget_start: 1.5
  budget_end: 1.0
  decay_frac: 0.30

# ----------------------------------------------------------
# Phantom Bidder: financial intermediary demand
# Represents ~40% of EU ETS demand from banks/hedge funds.
# ----------------------------------------------------------
phantom_bidder:
  enabled: false
  qty_frac_lo: 0.15
  qty_frac_hi: 0.35
  price_lognormal_sigma: 0.35
  price_fundamental_frac: 0.60
  price_min_above_reserve: 2.0
  price_max_frac_penalty: 0.65
  price_min_below_reserve_buffer: 5.0

# ----------------------------------------------------------
# Private per-episode urgency scalars
# LogNormal(0, σ) multiplied into effective penalty per agent.
# Creates private heterogeneity destroying symmetric floor equilibria.
# ----------------------------------------------------------
urgency_scalars:
  enabled: true
  lognormal_sigma: 0.30

# ----------------------------------------------------------
# ABLATION REFERENCE — tabula_rasa
# DO NOT set enabled: true. Tabula-rasa is no longer a runtime
# override; configure each schedule directly in its own section.
# These values show the "blank slate" ablation baseline for reference:
#   - No BC, no KL anchor, no action anchors
#   - Wide uniform exploration (30% → 10%)
#   - High entropy, fast shaping decay
# ----------------------------------------------------------
tabula_rasa:
  enabled: false
  epsilon_start: 0.30
  epsilon_final: 0.10
  epsilon_decay_frac: 0.90
  entropy_coef: 0.08
  entropy_decay_start_frac: 0.0
  entropy_decay_window_frac: 0.95
  critic_warmup_frac: 0.03
  shaping_decay_frac: 0.60
  hpp_warmup_frac: 0.25
  exploration_mode: "uniform"

# ----------------------------------------------------------
# Pricing curriculum (disabled by default)
# When enabled: PAB first → uniform pricing after pab_frac.
# PAB creates direct bid-price gradients to bootstrap learning
# before uniform pricing's zero-direct-gradient regime.
# ----------------------------------------------------------
pricing_curriculum:
  enabled: false
  pab_frac: 0.20
