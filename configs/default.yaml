# ETS MARL — Configuration v8.6.0
# 8 learning agents, HAPPO sequential update, split Phase-1 bid/invest heads.

# Run version banner — printed at the top of training output so the version
# of every run is visible from stdout. Bump in lockstep with pyproject.toml
# `version` and the header comment above.
version: "8.5.6"

simulation:
  n_years: 12
  n_episodes: 120000
  seeds: [42, 123, 456]

# "auto" picks CUDA if available, else CPU.
device: auto


technologies:
  names: ["coal", "gas", "onshore_wind", "offshore_wind", "solar"]
  emission_factors: [0.820, 0.490, 0.011, 0.012, 0.048]  # tCO2/MWh
  capex: [3000, 1150, 1350, 3250, 750]                   # EUR/kW
  capacity_factors: [0.65, 0.60, 0.35, 0.47, 0.17]
  deploy_delays: [0, 0, 4, 7, 2]                          # years; solar 2yr, onshore 4yr, offshore 7yr
  operational_costs: [72.0, 55.0, 17.0, 47.0, 10.0]      # EUR/MWh fuel+O&M
  decommission_costs: [200, 100, 0, 0, 0]                 # EUR/kW
  is_green: [false, false, true, true, true]
  is_buildable: [false, false, true, true, true]

ets:
  cap_year_0_override: null     # null = emission-weighted calibration
  initial_bank_fraction: 0.5
  cap_overhead_pct: 0.10

  lrf_phase1: 0.043
  lrf_phase2: 0.044
  lrf_phase_switch: 2

  msr:
    enabled: true
    tnac_upper_ratio: 0.68
    tnac_mid_ratio: null
    tnac_lower_ratio: null
    withhold_rate: 0.24
    release_frac: 0.0638297872
    activation_year: 1
    price_containment_absolute: 175
    price_release_absolute: 212
    price_release_enabled: false
    emergency_release_frac: 0.064
    min_auction_frac: 0.10

  banking: true
  reserve_price: 45.0
  reserve_price_mode: "static"
  reserve_discount: 0.80
  reserve_initial: 50.0
  unsold_to_msr: false
  max_rollover_multiplier: 1.5
  price_history_anchor: "auction"

# 8 learning agents (2× each of 4 archetypes), 10 TWh/yr each.
companies:
  n_agents: 8
  output_twh: 10.0
  initial_mix:                     # [coal, gas, onshore, offshore, solar]
    - [0.25, 0.30, 0.20, 0.15, 0.10]   # A1: 45% green
    - [0.25, 0.30, 0.20, 0.15, 0.10]   # A2: 45% green
    - [0.15, 0.35, 0.25, 0.15, 0.10]   # A3: 50% green
    - [0.15, 0.35, 0.25, 0.15, 0.10]   # A4: 50% green
    - [0.10, 0.25, 0.30, 0.20, 0.15]   # A5: 65% green
    - [0.10, 0.25, 0.30, 0.20, 0.15]   # A6: 65% green
    - [0.05, 0.20, 0.30, 0.25, 0.20]   # A7: 75% green
    - [0.05, 0.20, 0.30, 0.25, 0.20]   # A8: 75% green
  reward_weights:                  # [w_cost, w_green]
    - [1.0, 0.0]   # A1: pure financial
    - [0.5, 0.5]   # A2: balanced ESG
    - [1.0, 0.0]   # A3: pure financial
    - [0.5, 0.5]   # A4: balanced ESG
    - [1.0, 0.0]   # A5: pure financial
    - [0.5, 0.5]   # A6: balanced ESG
    - [1.0, 0.0]   # A7: pure financial
    - [0.5, 0.5]   # A8: balanced ESG

  n_bot_agents: 0
  bot_initial_mix:
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # B1: coal-heavy
    - [0.40, 0.40, 0.10, 0.05, 0.05]   # B2: coal-heavy
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # B3: gas-dominant
    - [0.15, 0.45, 0.20, 0.10, 0.10]   # B4: gas-dominant
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # B5: transitioner
    - [0.05, 0.25, 0.35, 0.20, 0.15]   # B6: transitioner
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # B7: green-leader
    - [0.00, 0.10, 0.30, 0.35, 0.25]   # B8: green-leader
  bot_reward_weights:
    - [1.0, 0.0]   # B1
    - [0.5, 0.5]   # B2
    - [1.0, 0.0]   # B3
    - [0.5, 0.5]   # B4
    - [1.0, 0.0]   # B5
    - [0.5, 0.5]   # B6
    - [1.0, 0.0]   # B7
    - [0.5, 0.5]   # B8

investment:
  max_invest_frac: 0.20
  convexity_alpha: 0.20
  discount_rate: 0.05   # 5% WACC

risk:
  p_fail_min: 0.08
  # v8.5.8: reduced from 0.65 → 0.40 to align with policy-supported industry
  # FID risk for offshore wind / solar (10-15% with PPA, ~30% under merchant
  # exposure). 0.65 was punitively high and combined with the experience-
  # discount loop to produce 10× inter-agent invest variance.
  p_fail_max: 0.40
  p_fail_alpha: 0.7
  experience_discount: 0.10
  experience_threshold: 2

auction:
  price_max: 250.0
  price_min: 45.0
  quantity_max: 3.0
  bid_change_limit:
    enabled: true
    value: 75.0        # max year-over-year bid change (EUR/t)
  qty_mult_low: 0.5
  qty_mult_high: 2.0
  max_agent_share: 1.0
  pricing_rule: "uniform"
  cancel_under_subscribed: false
  lot_size: 0.0005
  collateral:
    enabled: true
    collateral_rate: 0.15
    hold_fraction: 0.02
    collateral_fraction: 0.20
    max_collateral_budget_share: 0.50
    min_qty_floor_frac: 0.5
  leverage_multiplier: 3.0
  suspension_length: 0
  budget_price_clip: true
  # v8.5.7 joint budget gate. Replaces the cascade of leverage / 10%-notional /
  # budget-price-clip gates. Quantity is sized against EXPECTED settlement cost
  # (clearing × alloc + collateral) so a high willingness-to-pay (bid_p) does
  # not artificially shrink qty in expectation. The legacy `leverage_multiplier`
  # and `budget_price_clip` knobs above are retained for back-compat but no
  # longer drive bid sizing when budget_gate.enabled=true.
  budget_gate:
    enabled: true
    safety_mult: 1.2          # buffer over expected_clearing for upward surprise
    notional_safety_mult: 5.0 # soft cap on bid_p × bid_q relative to cash
    # v8.6 two-stage gate. When the bid would over-spend cash:
    #   protect_need_floor=true → first shrink qty toward `need` only
    #     (never below need if originally ≥ need), then if still
    #     overbudget reduce bid_p toward max(reserve, MA3_inflated),
    #     then as last resort shrink qty below need.
    #   protect_need_floor=false → legacy v8.5.7 single-stage behaviour
    #     (always shrink qty first, never touch price unless notional cap).
    protect_need_floor: true
    # inflation_aware_ma3=true → scale price_ma3 by infl(t)/infl(t-1)
    # before taking max(reserve, MA3, anchor). Anchor is already inflation-
    # aware; without this MA3 lags real expected clearing in a high-
    # inflation regime and the gate undersizes its cash buffer.
    inflation_aware_ma3: true
  carry_forward_defaults: true

trading:
  enabled: true
  transaction_cost: 0.5
  spread_tolerance: 0.12
  sec_price_min: 45.0
  sec_price_max_mult: 2.0

secondary:
  liquidity_pool:
    enabled: false
    floor_fraction_of_penalty: 0.25

budget:
  mode: "revenue_based"
  # v8.5.8: debt_headrooms halved (and rebalanced from coal-heavy bias).
  # Anchor trajectory is 70 EUR/t (year 1) → 150 EUR/t (year 12); revenue
  # passthrough makes coal-heavy agents earn far more than greens at high
  # carbon prices. The previous [475, 305, 125, -25] schedule plus a 1.5×
  # cap meant coal-heavy agents had 56% more cash than greens in low-price
  # regimes (cap doesn't bind) AND ~13% more in high-price regimes (cap
  # binds for both). Halving the schedule preserves the transition-finance
  # signal but stops over-subsidising fossil incumbents.
  debt_headrooms: [240.0, 240.0, 155.0, 155.0, 65.0, 65.0, -25.0, -25.0]
  bot_debt_headrooms: [240.0, 240.0, 155.0, 155.0, 65.0, 65.0, -25.0, -25.0]
  budget_ema_alpha: 0.3
  annual_budgets: [880.0, 880.0, 800.0, 800.0, 820.0, 820.0, 780.0, 780.0]
  bot_annual_budgets: [880.0, 880.0, 800.0, 800.0, 820.0, 820.0, 780.0, 780.0]
  # v8.5.8: raised from 1.5 → 2.5. With anchor trajectory 70 → 150 EUR/t
  # (≈2.14×), the prior 1.5× cap discarded ~40% of the high-year carbon-
  # passthrough revenue, freezing budgets in years 6+ even as the system
  # value of every Mt rose. 2.5× lets the high-price years actually translate
  # into investable cash so the green transition is fundable when it matters.
  dynamic_budget_ceiling_multiplier: 2.5
  overspend_penalty_coef: 0.5
  contingency_zone: 0.10
  contingency_penalty_coef: 0.05
  hard_cap_fraction: 1.15   # drives both investment hard gate and compute_budget_penalty()
  soft_zone_start: 1.00
  tiered_penalty_coef: 2.0
  investment_hard_gate: true
  capex_throughputs: [130.0, 130.0, 130.0, 130.0, 160.0, 160.0, 120.0, 120.0]
  bot_capex_throughputs: [130.0, 130.0, 130.0, 130.0, 160.0, 160.0, 120.0, 120.0]
  capex_overspend_coef: 1.0
  emergency_loan:
    enabled: true
    max_loan_fraction: 0.15
    interest_rate: 0.08
    repayment_years: 3
    leverage_premium_coef: 0.25
    leverage_premium_exp: 1.5
    capex_squeeze_floor: 0.50
    origination_sting_coef: 0.07
  treasury_reserve:
    enabled: true
    retention_fraction: 0.60
    cap_multiple: 1.5
    decay_rate: 0.05
    terminal_value_rate: 0.30
  suspension_length: 1

green_finance:
  enabled: false
  loan_budget_boost: 200.0
  loan_interest_rate: 0.05
  capex_throughput_boost: 80.0

bots:
  valuation_noise_std: 5.0
  urgency_mult_low: 0.8
  urgency_mult_high: 1.2
  urgency_denominators: [1.3, 1.7, 1.3, 1.7, 1.3, 1.7, 1.3, 1.7]
  max_compliance_share: 0.70
  enhanced_noise:
    enabled: true
    valuation_noise_std: 15.0
    urgency_mult_low: 0.6
    urgency_mult_high: 1.5
    budget_stress_prob: 0.15
    budget_stress_qty_mult: 0.65
  fade_schedule:
    enabled: false
    schedule: [[0, 8], [30000, 6], [60000, 4], [80000, 2]]

penalty:
  rate: 138.75                     # EUR/tCO2 base 2026
  inflation_rate: 0.020
  inflation_random_std: 0.015
  carry_forward: true
  carry_forward_cap: 0.0

price:
  initial_expected: 70.0
  banking_premium_mult: 1.4
  burnin_std: 10.0
  ar1_persistence: 0.85
  volatility_std: 0.15

mac:
  enabled: true
  coal_to_gas_cost: 48.0           # EUR/tCO2 fuel-switching cost
  max_switch_frac: 0.20

electricity:
  enabled: true
  base_price: 55.0
  carbon_passthrough: 0.90

reward:
  normalizer_alpha: 0.02
  gae_min_std: 0.15
  opportunity_cost_rate: 0.0
  clip_min: -10.0
  clip_max: 10.0
  shaping_beta: 7.0
  shaping_gamma: 1.0
  shaping_decay_episode: 0         # auto: shaping_decay_frac × n_episodes
  shaping_decay_frac: 0.10
  shaping_weight_floor: 0.0
  terminal_bank_value: true
  terminal_queue_value: true
  terminal_payoff_years: 5
  treasury_terminal_value: true
  anchor_normalize_cost_only: true
  budget_norm_anchor: "dynamic"
  budget_norm_budget_0: 1000.0

  opportunity_cost_shaping:
    enabled: true
    scale: 1.0

  coverage_gap_shaping:
    enabled: true
    scale: 0.5

  banking_signal:
    enabled: true
    w_banking: 0.3
    w_imputed: 1.0
    imputed_cap_factor: 5.0
    initial_bank_cost_factor: 0.80

  # Coverage-gap remediation-rate proxy for the bid-head reward.
  # Smooths secondary-price spikes via a per-episode EMA and caps
  # the rate at `cap_mult × effective_penalty_rate`.
  sec_proxy:
    enabled: true
    ema_alpha: 0.30
    cap_mult: 1.5

  compliance_gate_blend_threshold: 0.90
  compliance_gate_blend_width: 0.30

# ESG (v8.6 saved-carbon hybrid):
#   esg = w_green × scale × (stock_w × ef_ratio + flow_w × ef_ratio × (anchor_real_t / anchor_real_0)
#                           + speed_coef × max(0, Δgreen)) × compliance_gate
# Stock term rewards SUSTAINED green share every year (no front-loading).
# Flow term monetises avoided carbon at the live anchor — rises with cap
# scarcity, mirroring the social shadow price of carbon. Removed the prior
# v8.5 ef_baseline = year/(n_years−1) horizon penalty that punished late
# investment as if year 12 were the end of civilisation.
esg:
  enabled: true
  scale: 1.0            # halved from v8.5 (2.0) since two channels now contribute
  stock_weight: 1.0     # weight on ef_ratio "we are green right now"
  flow_weight:  1.5     # weight on ef_ratio × anchor_real_ratio (saved-carbon at live anchor)
  speed_coef: 0.3       # v8.6: uniform across episode — no front-loading
  speed_coef_late: 0.3  # equal to speed_coef → flat over time

opponent_modeling:
  enabled: true

# 7D per opponent: emissions, green_frac, fossil_frac, queue_noisy,
# tnac_share_norm, net_secondary_norm, lagged_compliance_gap_norm
opponent_obs:
  mode: "lagged"
  lag_years: 1
  queue_noise_sigma: 0.15
  dims_per_opponent: 7

agent_cycling:
  enabled: false
  soft: true
  soft_lr_scale: 0.3

ppo:
  hidden_size: 256
  lr: 0.0002
  gamma: 0.99
  gae_lambda: 0.97
  clip_eps: 0.15
  entropy_coef: 0.08
  entropy_coef_final: 0.015        # raised from 0.005 — prevents std collapse late in training
  entropy_decay_start: -1          # -1 = auto (5% of n_episodes)
  entropy_decay_window: -1         # -1 = auto (entropy_decay_frac × n_episodes)
  entropy_decay_frac: 0.70
  value_coef: 0.5
  max_grad_norm: 0.5
  n_epochs: 3                      # lowered from 5 — fewer epochs ⇒ less ratio drift
                                   # per update; KL early-stop (target_kl) still bounds drift.
  mini_batch_size: 64
  episodes_per_update: 32
  long_run_episode_threshold: 20000
  short_run_overrides:
    lr: 0.0002
    entropy_coef_final: 0.03
    episodes_per_update: 16
  normalize_advantages: true
  log_std_min: -3.0                # raised from -3.5 — keeps a small exploration floor
                                   # (min raw σ ≈ 0.050 vs 0.030 before) without breaking
                                   # convergence, which has been brittle in past runs.
  log_std_max: 0.0
  centralized_critic: true
  # Phase-1 split-head: bid (dims 0-1) → main critic; invest (dims 2-5) → invest critic.
  split_invest_head: true
  happo: true
  happo_dynamic_order: true
  happo_order_metric: "advantage"   # "reward" uses prior EMA-reward ordering
  happo_perf_ema_alpha: 0.1
  critic_compliance_features: true
  critic_lr: 0.0005
  critic_hidden_size: 512
  critic_warmup_episodes: 0        # auto: 3% of n_episodes
  lr_decay: cosine
  lr_min: 0.00001
  critic_lr_decay: cosine
  critic_lr_min: 0.00005
  target_kl: 0.015
  # Dual-clip PPO (Ye et al. 2020): caps the unbounded negative-advantage
  # branch of the clipped surrogate when the importance ratio drifts.
  # Without this, a single mini-batch sample with adv<0 and r=exp(log_ratio)
  # large can drive policy_loss into the 1e6–1e8 range. c>1 (typical 3.0)
  # bounds the loss as max(min(r·A, clip(r)·A), c·A) for adv<0; positive
  # advantages are unaffected. Set to 0 to disable.
  dual_clip_c: 3.0
  # Numerical safety clamp on log(ratio_new/ratio_old) before exp(). The PPO
  # clipped surrogate already enforces the trust region; this guard prevents
  # ratio overflow and keeps the diagnostic actor-loss readout bounded.
  log_ratio_clip: 10.0
  kl_anchor_beta: 0.0
  kl_anchor_decay_episodes: 0      # auto: 50% of n_episodes
  critic_extra_epochs: 6
  critic_huber: true
  critic_huber_delta: 4.0
  clip_value: true
  normalize_returns: false

curriculum:
  enabled: false
  start_years: 4
  ramp_episodes: 3000

uncertainty:
  enabled: true
  sigma_demand: 0.07
  corr_rho: 0.40

construction_jitter:
  enabled: true
  poisson_lambdas: [1.0, 1.0, 2.0, 3.0, 1.5]
  p_cancel_per_tech: [0.0, 0.0, 0.010, 0.006, 0.015]  # per project per year; fossil ignored
  p_cancel: 0.010   # fallback scalar
  recovery_rate: 0.40
  cf_sigma: [0.0, 0.0, 0.08, 0.08, 0.05]

warm_start:
  enabled: true
  burnin_enabled: true
  n_burnin_years: 4
  burnin_price_seed_mean: 70.0
  burnin_price_seed_std: 10.0
  n_burnin_prices: 2
  bank_seed_min: 0.15
  bank_seed_max: 0.35
  queue_mu_onshore: 1.5
  queue_mu_offshore: 0.5
  queue_mu_solar: 2.0
  msr_initial_reserve_frac: 0.23

logging:
  log_interval: 100
  save_interval: 500
  csv_flush_interval: 1000
  snapshot_interval: 2500
  # Cap how many historical (training_log, year_log) snapshot pairs are
  # retained on disk per seed. Each snapshot is a copy of the *cumulative*
  # CSV, so unbounded retention scales quadratically with episode count and
  # exhausts the local disk on long Azure runs. Default 1 → a single rolling
  # snapshot pair per seed (linear footprint). Set higher only if you
  # specifically need mid-run snapshots beyond the latest.
  snapshot_keep_recent: 1
  results_dir: "results/"
  checkpoint_pruning:
    enabled: true
    # Run pruning periodically during training (after each periodic save),
    # not only on clean exit. Bounds peak disk usage of ``checkpoints_*/``
    # to ~(n_keep_recent + n_keep_milestones) × n_agents files at all times.
    online: true
    n_keep_milestones: 20
    n_keep_recent: 5

pretrain:
  enabled: false
  episodes: 0   # auto: 4% of n_episodes
  epochs: 0     # auto: scales with n_episodes
  lr: 0.001

diagnostics:
  market_broken_window: 200
  market_broken_bid_threshold: 0.99
  floor_bid_threshold: 1.02
  zero_qty_threshold: 0.01
  stuck_boost_window: 250
  stuck_boost_coef: 0.04
  esg_over_penalty_warn_window: 50

hpp:
  enabled: true
  pool_size: 10
  save_interval: 0      # auto: 3% of n_episodes
  swap_prob: 0.20
  warmup_episodes: 0    # auto: 20% of n_episodes
  seed_heuristic: false
  seed_count: 2

exploration:
  mode: "anchored"
  epsilon_start: 0.25
  epsilon_final: 0.02
  epsilon_decay_episodes: 0         # auto: epsilon_decay_frac × n_episodes
  epsilon_decay_frac: 0.45
  anchor_boost: 1.14
  auction_anchors: null
  secondary_anchors: null
  # Anchor-snap exploration (Tier-3 mitigation for seed-driven price-basin
  # lock-in). With probability ``prob_per_episode`` at the start of each
  # episode, each agent's auction price_head.bias is temporarily snapped
  # to the fundamental anchor for the rollout, then restored before the
  # PPO update. Gives policies that have settled into a high-price basin a
  # probabilistic exit toward the low (fundamental) basin without
  # permanently overwriting learned weights. Set ``enabled: false`` to
  # disable, or ``prob_per_episode: 0`` for the same effect.
  #
  # Defaulted to ``enabled: false`` pending empirical validation: the
  # snapped-rollout transitions are retained in the PPO buffer, but the
  # log-prob is recorded under the snapped policy and re-evaluated under
  # the restored policy at update time. PPO's clipped surrogate + dual-clip
  # absorb mild off-policy correction, but for policies far from the anchor
  # (which is precisely the basin-lock-in regime) the importance-ratio
  # clamp can saturate. Opt in for basin-lock-in sweeps when needed.
  anchor_snap:
    enabled: false
    prob_per_episode: 0.02

cap_curriculum:
  enabled: false
  cap_start: 1.3
  cap_end: 1.0
  decay_frac: 0.30

budget_curriculum:
  enabled: false
  budget_start: 1.5
  budget_end: 1.0
  decay_frac: 0.30

phantom_bidder:
  enabled: false
  qty_frac_lo: 0.15
  qty_frac_hi: 0.35
  price_lognormal_sigma: 0.35
  price_fundamental_frac: 0.60
  price_min_above_reserve: 2.0
  price_max_frac_penalty: 0.65
  price_min_below_reserve_buffer: 5.0

urgency_scalars:
  enabled: true
  lognormal_sigma: 0.30

# ABLATION REFERENCE — tabula_rasa (enabled: true raises ValueError)
tabula_rasa:
  enabled: false
  epsilon_start: 0.30
  epsilon_final: 0.10
  epsilon_decay_frac: 0.90
  entropy_coef: 0.08
  entropy_decay_start_frac: 0.0
  entropy_decay_window_frac: 0.95
  critic_warmup_frac: 0.03
  shaping_decay_frac: 0.60
  hpp_warmup_frac: 0.25
  exploration_mode: "uniform"
